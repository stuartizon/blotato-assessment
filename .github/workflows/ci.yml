name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blotato
          POSTGRES_PASSWORD: blotato
          POSTGRES_DB: blotato
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blotato"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: echo "DATABASE_URL=postgres://blotato:blotato@localhost:5432/blotato" > .env

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Run migrations
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration
