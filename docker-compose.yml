x-gotosocial-env: &gotosocial-env
  # Includes the port because we expose GoToSocial directly on :8080 with
  # no reverse proxy in front to normalize it back to :80 — GoToSocial
  # builds every absolute URL (avatars, profile links, etc.) from GTS_HOST
  # verbatim, so a bare "localhost" here produces asset URLs on port 80,
  # which nothing is listening on. Confirmed against a live instance that
  # this doesn't affect cookie-based sign-in (GoToSocial only sets a
  # cookie Domain attribute when the host has no port; with a port, it
  # falls back to an implicit host-only cookie, which every OAuth flow in
  # this repo — scripts/setup-gotosocial.sh, scripts/seed-gotosocial-data.sh
  # — already tolerates).
  GTS_HOST: localhost:8080
  GTS_PROTOCOL: http
  GTS_DB_TYPE: sqlite
  GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
  GTS_LETSENCRYPT_ENABLED: 'false'
  GTS_WAZERO_COMPILATION_CACHE: /gotosocial/.cache

x-gotosocial-seed-env: &gotosocial-seed-env
  # Two accounts, not one — modeling this project's actual premise: a
  # business posts (blotato_seed), someone else comments on it
  # (blotato_commenter), and the app (a third, separate account
  # provisioned by scripts/setup-gotosocial.sh) replies automatically.
  GTS_SEED_USERNAME: ${GTS_SEED_USERNAME:-blotato_seed}
  GTS_SEED_EMAIL: ${GTS_SEED_EMAIL:-blotato-seed@example.org}
  GTS_SEED_PASSWORD: ${GTS_SEED_PASSWORD:-BlotatoSeed_2026!}
  GTS_COMMENTER_USERNAME: ${GTS_COMMENTER_USERNAME:-blotato_commenter}
  GTS_COMMENTER_EMAIL: ${GTS_COMMENTER_EMAIL:-blotato-commenter@example.org}
  GTS_COMMENTER_PASSWORD: ${GTS_COMMENTER_PASSWORD:-BlotatoCommenter_2026!}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blotato
      POSTGRES_PASSWORD: blotato
      POSTGRES_DB: blotato
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Real, self-hosted, Mastodon-API-compatible platform used to exercise
  # GoToSocialAdapter against genuine HTTP calls. Comes up pre-seeded with
  # sample posts/comments (via gotosocial-account-init + gotosocial-seed
  # below) — no manual step needed to have real content to explore. Access-
  # token provisioning for *our own app* is a separate, deliberately manual
  # one-time step — see scripts/setup-gotosocial.sh and docs/ASSUMPTIONS.md.
  gotosocial:
    image: docker.io/superseriousbusiness/gotosocial:latest
    environment:
      <<: *gotosocial-env
    ports:
      - '8080:8080'
    volumes:
      - gotosocial-data:/gotosocial/storage
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot: creates the two accounts gotosocial-seed posts through (the
  # poster and the commenter). Uses the same image + storage volume as
  # `gotosocial` (not `docker exec` into it) so it works the same way
  # whether gotosocial was just started or was already running — see
  # scripts/seed-gotosocial-account.sh.
  gotosocial-account-init:
    image: docker.io/superseriousbusiness/gotosocial:latest
    environment:
      <<: [*gotosocial-env, *gotosocial-seed-env]
    volumes:
      - gotosocial-data:/gotosocial/storage
      - ./scripts/seed-gotosocial-account.sh:/seed-account.sh:ro
    depends_on:
      gotosocial:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/seed-account.sh']

  # One-shot: posts sample posts (as blotato_seed) and comments on them
  # (as blotato_commenter) via GoToSocial's real HTTP API — see
  # scripts/seed-gotosocial-data.sh. Skips itself once the poster account
  # already has posts (checked via the API), so repeat `docker compose up`
  # runs don't pile up duplicates.
  gotosocial-seed:
    image: curlimages/curl:8.11.1
    environment:
      <<: *gotosocial-seed-env
      GTS_BASE_URL: http://gotosocial:8080
    volumes:
      - ./scripts/seed-gotosocial-data.sh:/seed-data.sh:ro
    depends_on:
      gotosocial-account-init:
        condition: service_completed_successfully
    entrypoint: ['/bin/sh', '/seed-data.sh']

volumes:
  postgres-data:
  gotosocial-data:
